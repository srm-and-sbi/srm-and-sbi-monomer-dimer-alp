# Production Nuisance_DLI spec RANK4 (adopted 2026-11-09): one SGM per cell and 2 s window over all ten windows, equal cell mass,
# within-cell posterior_rank_median weights over mu_r, sigma_r, mu_pc, sigma_pc; bleaching and flicker overridden (reasons below).
# The historical fixed reference SEL and its decision record (DETECTOR_WORKFLOW.md sec. 7.6) are unchanged.
[block]
posterior_sample_pool_choice = "empirical_representatives"
candidate_archive = "/media/mars-fias/MARS_Data_Reserve_0/MARS_Data_Bank/Projects/RCL_Agent_Projects/srm-and-sbi-monomer-dimer-alp/Data_Bank/Posit/SRM_AND_SBI_MONOMER_DIMER_ALP_DETECTOR_FAB_2S_50FPS_C128V42A_MAP_Experiment_COHORT60RANKSR3/aggregation_candidates.npz"
candidate_archive_sha256 = "5fe7091bef07ce75a4659d322c1c5072c33cfa6ed592aa27038ecf3df5f037ce"
rationale = "Production selection RANK4 (adopted 2026-11-09 after review): one SGM representative per cell and 2 s window over all ten windows of the sixty FAB recordings (600 vectors), so that the between-cell and the within-recording variation of the effective imaging conditions across the full acquisition both enter the simulated population; member weighting posterior_rank_median keeps equal total probability per cell and, within a cell, weights each window by the median cross-posterior distance rank of its SGM among that cell's other windows (an unusual window receives less weight, a majority-zero window exactly zero, both documented; no cell is down-weighted as a whole). The four spatial and brightness coordinates of each SGM are retained together; the bleaching probability is overridden by the recorded value 0.05 (empirically anchored for Fab, declared for InlB) and the flicker rate by the direct single-dye-equivalent reference of the committed derivation, because the estimator does not recover the former and only partially recovers the latter. One complete vector is sampled per synthetic 2 s video and held fixed during it. Member weights from the ranks over the four retained coordinates only (rank space spatial_brightness), so the weights rest on exactly the coordinates the final vectors carry."

[[component]]
source_experiment = "SRM_AND_SBI_MONOMER_DIMER_ALP_DETECTOR_FAB_2S_50FPS_C128V42A"
condition = "FAB"
window_set = "all"
grouping = "per_cell_window"
statistic = "sgm"
weight = 1.0
member_weighting = "posterior_rank_median"
rank_coordinates = ["mu_r", "sigma_r", "mu_pc", "sigma_pc"]

[override.prob_photo_bleach]
value = 0.05
reason = "empirically anchored declared per-dye bleaching probability over the fixed 100-frame reference interval: the measured whole-recording fluorescence decline of the sixty MET-FAB recordings over 20 s (0.054 to 0.057 per 100-frame interval, record ..._20S_50FPS_Direct_Fluorescence_Loss_Experiment_RAW), rounded as a working value and selected on 2026-10-01 (DETECTOR_WORKFLOW.md sec. 7.6). The estimator's own coordinate (median 0.093, MAP 0.148) is not retained: it does not recover the parameter on synthetic videos (r 0.06). Assumptions: ideal independent dyes of stationary mean brightness; the decline is not single-exponential, emitters leaving the field and label exchange are not separable from bleaching."

[override.lambda_rate]
value = 5.1
reason = "direct single-dye-equivalent reference: lambda_rate shape-matched to the normalized ln-brightness autocorrelation of the MET-FAB single-molecule localization tables (31,161 tracks, public accession S-BSST712; tau_corr(1/e) about 0.135 s), the matched-length model arm absorbing the finite-track detrending bias (DETECTOR_WORKFLOW.md sec. 6.5; the committed derivation Script_Bank/Analysis/SRM_AND_SBI_MONOMER_DIMER_ALP_DETECTOR_Flicker_Rate_Derivation.md). Assumptions that travel with the value: one dye per trace with the logarithm taken per trace (a multi-dye spot's ln-intensity is not a single-dye OU process and its autocorrelation also depends on sigma_pc), so this is a reference under the single-emitter assumption, not a calibration of dye multiplicity or of the image-analysis chain; mu_pc and sigma_pc cancel in the single-dye normalized autocorrelation. The adopted neural estimator's per-window coordinate (median 8.096, partially recovered, MAE 0.217 dex, r 0.49) is not retained; the neural value 8 of the SEL record (sec. 7.6) is a documented alternative. The condition-specific localization-table references, 5.1 per second for FAB and 4.7 for INLB, are similar within the reported cell-to-cell scatter; we use them as empirically anchored working overrides under the single-emitter model. Their agreement does not establish unbiased per-dye recovery; observation-chain effects and the single-dye approximation remain limitations. This is a selection from existing evidence, not a new measurement or a validation of the derivation."
