# Production Nuisance_DLI spec RANK4 (adopted 2026-11-09): one SGM per cell and 2 s window over all ten windows, equal cell mass,
# within-cell posterior_rank_median weights over mu_r, sigma_r, mu_pc, sigma_pc; bleaching and flicker overridden (reasons below).
# The historical fixed reference SEL and its decision record (DETECTOR_WORKFLOW.md sec. 7.6) are unchanged.
[block]
posterior_sample_pool_choice = "empirical_representatives"
candidate_archive = "/media/mars-fias/MARS_Data_Reserve_0/MARS_Data_Bank/Projects/RCL_Agent_Projects/srm-and-sbi-monomer-dimer-alp/Data_Bank/Posit/SRM_AND_SBI_MONOMER_DIMER_ALP_DETECTOR_INLB_2S_50FPS_C128V42AP3LR32_MAP_Experiment_COHORT60RANKSR3/aggregation_candidates.npz"
candidate_archive_sha256 = "edb630d06832a49e5fc82626a0d55a360b0f540dcb6e95492232668704e1f401"
rationale = "Production selection RANK4 (adopted 2026-11-09 after review): one SGM representative per cell and 2 s window over all ten windows of the sixty INLB recordings (600 vectors), so that the between-cell and the within-recording variation of the effective imaging conditions across the full acquisition both enter the simulated population; member weighting posterior_rank_median keeps equal total probability per cell and, within a cell, weights each window by the median cross-posterior distance rank of its SGM among that cell's other windows (an unusual window receives less weight, a majority-zero window exactly zero, both documented; no cell is down-weighted as a whole). The four spatial and brightness coordinates of each SGM are retained together; the bleaching probability is overridden by the recorded value 0.05 (empirically anchored for Fab, declared for InlB) and the flicker rate by the direct single-dye-equivalent reference of the committed derivation, because the estimator does not recover the former and only partially recovers the latter. One complete vector is sampled per synthetic 2 s video and held fixed during it. Member weights from the ranks over the four retained coordinates only (rank space spatial_brightness), so the weights rest on exactly the coordinates the final vectors carry."

[[component]]
source_experiment = "SRM_AND_SBI_MONOMER_DIMER_ALP_DETECTOR_INLB_2S_50FPS_C128V42AP3LR32"
condition = "INLB"
window_set = "all"
grouping = "per_cell_window"
statistic = "sgm"
weight = 1.0
member_weighting = "posterior_rank_median"
rank_coordinates = ["mu_r", "sigma_r", "mu_pc", "sigma_pc"]

[override.prob_photo_bleach]
value = 0.05
reason = "declared shared-rate assumption: the same dye, illumination, camera settings and 100-frame reference interval as MET-FAB, so the Fab empirically anchored value 0.05 is adopted as the practical baseline in the absence of an InlB decline analysis (the lead, 2026-10-27; DETECTOR_WORKFLOW.md sec. 7.6). The estimator's own coordinate (median 0.100, MAP 0.120) is not retained: it does not recover the parameter (r 0.02). No measurement on the InlB recordings supports the value."

[override.lambda_rate]
value = 4.7
reason = "direct single-dye-equivalent reference: lambda_rate shape-matched to the normalized ln-brightness autocorrelation of the MET-INLB single-molecule localization tables (61,884 tracks, public accession S-BSST712; tau_corr(1/e) about 0.145 s), the matched-length model arm absorbing the finite-track detrending bias (DETECTOR_WORKFLOW.md sec. 6.5; the committed derivation Script_Bank/Analysis/SRM_AND_SBI_MONOMER_DIMER_ALP_DETECTOR_Flicker_Rate_Derivation.md). Assumptions that travel with the value: one dye per trace with the logarithm taken per trace (a multi-dye spot's ln-intensity is not a single-dye OU process and its autocorrelation also depends on sigma_pc), so this is a reference under the single-emitter assumption, not a calibration of dye multiplicity or of the image-analysis chain; mu_pc and sigma_pc cancel in the single-dye normalized autocorrelation. The adopted neural estimator's per-window coordinate (median 2.283, partially recovered, MAE 0.206 dex, r 0.53, conditioned on the extrapolated PSF-width estimate) is not retained. The condition-specific localization-table references, 5.1 per second for FAB and 4.7 for INLB, are similar within the reported cell-to-cell scatter; we use them as empirically anchored working overrides under the single-emitter model. Their agreement does not establish unbiased per-dye recovery; observation-chain effects and the single-dye approximation remain limitations. The neural SEL value 2 remains a documented alternative; the factor-of-four difference between the neural values is recorded, not explained, and does not by itself show them wrong. This is a selection from existing evidence, not a new measurement or a validation of the derivation."
