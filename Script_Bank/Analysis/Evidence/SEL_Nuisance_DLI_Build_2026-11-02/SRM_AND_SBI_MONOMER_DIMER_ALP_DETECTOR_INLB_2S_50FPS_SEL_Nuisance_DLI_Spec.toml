# ============================================================================
# Nuisance_DLI spec -- selection_user: ONE explicitly chosen, fixed imaging vector.
# ============================================================================
# Fill every [selection.<KEY>] table: `value` in PHYSICAL units, `source` (where the value
# comes from: which estimator, product and aggregation, or which measurement) and
# `limitation` (what the value does not establish). The build converts to log10, refuses a
# value outside the detector prior box unless its key is listed in allow_outside_prior with
# a non-empty outside_prior_justification (an acknowledgement of extrapolation beyond the
# tested imaging domain, not a certification), never clips, needs no estimator and no GPU,
# and records the vector as user-selected and fixed, with no calibrated joint uncertainty.
# provenance (auto-filled, do not edit): {"choice": "selection_user", "condition": "INLB", "nuisance_tag": "SEL", "timing_label": "2S_50FPS"}

[block]
posterior_sample_pool_choice = "selection_user"
allow_outside_prior = ["mu_r"]   # keys whose value may sit outside the prior box
outside_prior_justification = "mu_r 2.256 px lies above the detector prior box [1, 1.99526]: the adopted InlB estimator returns PSF-width estimates beyond its training range on 94 % of the experimental windows; this acknowledges an extrapolation beyond the tested imaging domain and certifies nothing about the physical PSF width (DETECTOR_WORKFLOW.md sec. 7.6 and 9.10; the lead, 2026-10-27)"

[selection.mu_r]
# prior box (physical): [1, 1.99526]
value = 2.256
source = "adopted InlB detector estimator C128V42AP3LR32, record ..._INLB_2S_50FPS_C128V42AP3LR32_MAP_Experiment, median over the 600 per-window posterior medians (ten 2 s windows of the sixty recordings), transformed to physical units; MAP and SGM aggregates read beside it (MAP 2.256, SGM 2.253). Declared reference scenario: the estimator recovers mu_r on synthetic videos inside the prior box (MAE 0.009 dex, r 0.99) and returns, on the recordings, values beyond its training range (above the 2.0 px edge in 94 % of windows and in 57 of 60 recordings); retained under the source hierarchy because the recordings are read as wider than any in-box value and no in-box value is better supported (the lead, 2026-10-27). The localization per-detection width 1.47 against 1.36 for Fab (sec. 6.7 caveat 3) is the same direction and a different quantity"
limitation = "an extrapolation of the learned flow beyond its tested imaging domain, which does not independently establish the physical PSF width of the InlB recordings; the in-domain value at the exact prior ceiling, 10^0.3 = 1.9952623 px, is the sensitivity scenario SEL_MU_R, and neither choice establishes the physical width; falls 0.02 dex along a recording; point estimate retained as produced, precision not established"

[selection.sigma_r]
# prior box (physical): [0.1, 0.562341]
value = 0.4029
source = "adopted InlB detector estimator C128V42AP3LR32, same record and aggregation (MAP 0.4015, SGM 0.403); localization reference 0.42 as fitted (sec. 6.2). Neural estimate retained as a working value: synthetic recovery is demonstrated within the training domain (MAE 0.029 dex, r 0.98); experimental use here accompanies the extrapolated PSF-width estimate"
limitation = "the assembled vector lies outside the tested joint domain through mu_r; wider than Fab's 0.177; no within-recording trend (+0.01 dex, not significant); experimental accuracy model-dependent"

[selection.mu_pc]
# prior box (physical): [100, 562.341]
value = 152.9
source = "adopted InlB detector estimator C128V42AP3LR32, same record and aggregation (MAP 156, SGM 148.1). Neural estimate retained as a working value: synthetic recovery is demonstrated within the training domain (MAE 0.024 dex, r 0.99); experimental use here accompanies the extrapolated PSF-width estimate. The localization per-detection brightness 690 against 386 for Fab is a spot-level sum (sec. 6.7 caveat 3); the per-dye ratio to Fab here is 1.46"
limitation = "window spread 0.29 dex and a fall of 0.20 dex along a recording (over 0.3 dex in 35 to 38 % of recordings), markedly less stable than Fab's; 18 to 20 % of windows below the 100-photon prior edge; a window median across a strong within-recording decline; a per-dye value under the labeling and camera assumptions"

[selection.sigma_pc]
# prior box (physical): [0.177828, 1]
value = 0.8588
source = "adopted InlB detector estimator C128V42AP3LR32, same record and aggregation (MAP 0.8238, SGM 0.857); localization reference 0.55 as fitted (sec. 6.2). Neural estimate retained as a working value: synthetic recovery is demonstrated within the training domain (MAE 0.074 dex, r 0.92); experimental use here accompanies the extrapolated PSF-width estimate"
limitation = "the same conditioning as mu_pc; 5 to 6 % of windows above the 1.0 prior edge; experimental accuracy model-dependent"

[selection.prob_photo_bleach]
# prior box (physical): [0.01, 0.316228]
value = 0.05
source = "declared: an explicit shared-rate assumption, the same dye, illumination, camera settings and 100-frame reference interval as MET-FAB, so the Fab empirically anchored value 0.05 is adopted as the practical baseline in the absence of an InlB decline analysis (the lead, 2026-10-27). The adopted estimator's own value (median 0.100, MAP 0.120) plays no part: it does not recover the parameter (r 0.02)"
limitation = "no measurement on the InlB recordings supports it; the swift track-termination rate for InlB (0.014 per frame against 0.010 for Fab, Rahm et al. 2021) does not establish a change in per-dye bleaching; the faster-loss value 0.10 is the declared sensitivity scenario SEL_PB10; an InlB decline analysis would supply an independent empirical constraint, not a direct measurement of this parameter, and is deferred"

[selection.lambda_rate]
# prior box (physical): [1, 10]
value = 2.0
source = "declared, the rounded neural-based working choice from the adopted InlB detector estimator C128V42AP3LR32 (median 2.283 per second, MAP 2.664, SGM 2.376; window spread 0.36 dex); partially recovered (MAE 0.206 dex, r 0.53), so its digits are not retained; no InlB localization anchor exists"
limitation = "unstable across windows and conditioned on the extrapolated PSF-width estimate; the unrounded neural medians differ by a factor of about 3.5 between the conditions (2.28 against 8.10) and the selected values by a factor of four (2 against 8), a difference the model attributes to the recordings and the record does not explain; Fab's value 8 is the shared-rate sensitivity scenario SEL_LAMBDA, a useful comparison that does not establish that both conditions must share one inferred effective flicker rate; rises 0.09 dex along a recording"
